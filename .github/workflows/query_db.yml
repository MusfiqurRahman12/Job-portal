name: Query DB Stats

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: sudo apt-get install -y postgresql-client

      - name: Query Counts
        run: |
          echo "Connecting to DB and querying counts..."
          psql "$DATABASE_URL" -c "SELECT 'active_jobs' as metric, COUNT(*)::text as val FROM jobs WHERE is_active = TRUE AND expires_at > CURRENT_TIMESTAMP UNION ALL SELECT 'total_articles' as metric, COUNT(*)::text as val FROM news;"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
