name: Scrape Jobs (Auto)

on:
  schedule:
    - cron: '0 */6 * * *'     # Every 6 hours — fully automatic (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: {}         # Manual trigger button (optional)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Scraper
        run: go run main.go scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}

  # ── Alert on Failure ──────────────────────────────
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: scrape
    if: failure()
    steps:
      - name: Send Failure Alert Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "🚨 FutureTalent Scraper FAILED — Run #${{ github.run_number }}"
          to: musfiqurrahmansqa@gmail.com
          from: FutureTalent Alert <${{ secrets.ALERT_EMAIL }}>
          body: |
            ⚠️ Scrape Session FAILED

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            📋 Details:
            • Run Number: #${{ github.run_number }}
            • Run ID: ${{ github.run_id }}
            • Workflow: ${{ github.workflow }}
            • Trigger: ${{ github.event_name }}
            • Branch: ${{ github.ref_name }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            🔗 View full error logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            This is an automated alert from FutureTalent's job scraping system.
            The scraper runs every 6 hours. If the issue persists, check the
            DATABASE_URL and GEMINI_API_KEY secrets in your GitHub repository.
