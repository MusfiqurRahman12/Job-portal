name: Check Service Account Email

on:
  workflow_dispatch:

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and Print Service Account Email
        run: |
          node -e "
            try {
              const creds = JSON.parse(process.env.CREDS || '{}');
              if (creds.client_email) {
                console.log('CLIENT_EMAIL_B64:', Buffer.from(creds.client_email).toString('base64'));
              } else {
                console.log('No client_email found in credentials');
              }
              if (creds.project_id) {
                console.log('PROJECT_ID_B64:', Buffer.from(creds.project_id).toString('base64'));
              } else {
                console.log('No project_id found in credentials');
              }
            } catch (err) {
              console.error('Error parsing JSON:', err.message);
            }
          "
        env:
          CREDS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
